name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[deck,test]"
      # Includes tests/test_decks.py, which fails if decks/*.apkg is out of
      # date with the templates or data: run zhongwen-anki-build-all.
      - run: pytest
