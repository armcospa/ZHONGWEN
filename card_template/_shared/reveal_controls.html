<div class=bottomcontrols>
    <!-- Pleco lookup buttons, disabled by default: they only work if the Pleco
         Chinese dictionary app is installed on the device. Uncomment to re-enable.
    <div class=controlPleco><a href="plecoapi://x-callback-url/s?q={{Simplified}}&mode=df&hw={{Simplified}}&py={{Pinyin}}&sec=dict&x-source=AnkiDroid">&nbsp&nbspWord&nbsp</a></div>
    <div class=controlPleco><a href="plecoapi://x-callback-url/s?q={{SentenceSimplified}}">&nbspSentence</a></div>
    <div class=controlPleco><a href="plecoapi://x-callback-url/s?q={{DictionarySimplified}}">Dictionary&nbsp</a></div>
    -->
    <div class=controlHide onclick="toggleVisibility('sentencePinyinHidden');toggleVisibility('dictionaryPinyinHidden');toggleDisplay('sentence');toggleDisplay('sentenceColored');toggleDisplay('synonyms');toggleDisplay('synonymsColored');toggleDisplay('dictionary');toggleDisplay('dictionaryColored')">&nbsp&nbspUnhide&nbsp</div>
</div>

<script>
    function toggleVisibility(className) {
        var elements = document.getElementsByClassName(className);
        for (var i = 0; i < elements.length; i++) {
            elements[i].style.visibility = window.getComputedStyle(elements[i]).visibility === "visible" ? "hidden" : "visible";
        }
    }

    function toggleDisplay(className) {
        var elements = document.getElementsByClassName(className);
        for (var i = 0; i < elements.length; i++) {
            elements[i].style.display = window.getComputedStyle(elements[i]).display === "block" ? "none" : "block";
        }
    }
</script>
